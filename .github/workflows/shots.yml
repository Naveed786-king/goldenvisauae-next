name: Dashboard screenshots

on:
  workflow_dispatch:
  push:
    branches: [abu-dashboard, abu-apply, admin-setup-pages]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CiPassword123
      UPLOAD_DIR: uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Start
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/auth/me >/dev/null && break; sleep 2; done
      - name: Sample client with a quote, a payment and a message
        run: |
          set -e
          B=http://localhost:3000
          A=$(curl -sf -c client.txt -X POST $B/api/apply -F service="UAE Golden Visa" -F fullName="Sara Ahmed" -F email=sara@example.com -F phone=+971500000001 -F password=ClientPass123 -F consent=true)
          echo "$A"; ID=$(echo "$A" | node -pe 'JSON.parse(require("fs").readFileSync(0)).id')
          curl -sf -X POST $B/api/apply -b client.txt -F service="Family & Dependant Visa" -F fullName="Sara Ahmed" -F phone=+971500000001 > /dev/null
          curl -sf -c admin.txt -X POST $B/api/auth/login -H 'Content-Type: application/json' -d '{"email":"admin@example.com","password":"CiPassword123","admin":true}' > /dev/null
          F=$B/api/admin/applications/$ID/file
          curl -sf -b admin.txt -X POST $F -H 'Content-Type: application/json' -d '{"action":"quote","lines":[{"label":"Government fees","amount":4800}],"serviceFee":2500,"vatPct":5,"send":true,"notify":false}'; echo
          curl -sf -b admin.txt -X POST $F -H 'Content-Type: application/json' -d '{"action":"payment","label":"Visa issuance fee","amount":1250,"notify":false}'; echo
          curl -sf -b admin.txt -X POST $B/api/admin/applications/$ID/messages -H 'Content-Type: application/json' -d '{"body":"Hello Sara, your documents look good. Please accept the quotation so we can start."}'; echo
      - name: Screenshots
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.0
          npx playwright install --with-deps chromium
          cat > shot.mjs <<'EOF'
          import { chromium } from 'playwright';
          const B = 'http://localhost:3000';
          const b = await chromium.launch();
          for (const [name, vp] of [['desktop', { width: 1366, height: 900 }], ['phone', { width: 390, height: 844 }]]) {
            const ctx = await b.newContext({ viewport: vp, deviceScaleFactor: 1 });
            const p = await ctx.newPage();
            await p.goto(B + '/portal/login', { waitUntil: 'networkidle' });
            await p.screenshot({ path: `shots/${name}-login.png`, fullPage: true });
            await p.goto(B + '/portal/apply', { waitUntil: 'networkidle' });
            await p.screenshot({ path: `shots/${name}-apply-public.png`, fullPage: true });
            const card = p.locator('.aw-card').first();
            if (await card.count()) { await card.click(); await p.locator('.apply-nav .btn-red').click(); await p.waitForTimeout(500); await p.screenshot({ path: `shots/${name}-apply-details.png`, fullPage: true }); }
            const r = await p.request.post(B + '/api/auth/login', { data: { email: 'sara@example.com', password: 'ClientPass123' } });
            console.log(name, 'login', r.status());
            for (const path of ['/portal', '/portal/apply', '/portal/files', '/portal/quotes', '/portal/invoices', '/portal/statement', '/portal/services', '/portal/account']) {
              const res = await p.goto(B + path, { waitUntil: 'networkidle' });
              console.log(path, res && res.status());
              if (name === 'phone') {
                const wide = await p.evaluate(() => [...document.querySelectorAll('body *')].filter((e) => e.getBoundingClientRect().right > innerWidth + 2).slice(0, 5).map((e) => `${e.tagName}.${String(e.className).slice(0, 60)}`));
                if (wide.length) console.log(path, 'WIDE', JSON.stringify(wide));
              }
              await p.screenshot({ path: `shots/${name}${path.replace(/\//g, '-')}.png`, fullPage: true });
            }
            await p.goto(B + '/portal/files', { waitUntil: 'networkidle' });
            const href = await p.evaluate(() => document.querySelector('a[href*="/portal/t/"]')?.getAttribute('href'));
            console.log('file link', href);
            if (href) {
              const res = await p.goto(B + href, { waitUntil: 'networkidle' });
              console.log('file page', res && res.status());
              await p.screenshot({ path: `shots/${name}-file.png`, fullPage: true });
            }
            await ctx.close();
          }
          {
            const ctx = await b.newContext({ viewport: { width: 1366, height: 900 }, deviceScaleFactor: 1 });
            const p = await ctx.newPage();
            await p.goto(B + '/admin/login', { waitUntil: 'networkidle' });
            const r = await p.request.post(B + '/api/auth/login', { data: { email: 'admin@example.com', password: 'CiPassword123', admin: true } });
            console.log('admin login', r.status());
            await p.goto(B + '/admin/applications', { waitUntil: 'networkidle' });
            await p.screenshot({ path: 'shots/admin-applications.png', fullPage: true });
            const href = await p.evaluate(() => [...document.querySelectorAll('a[href^="/admin/applications/"]')].map((x) => x.getAttribute('href')).find((h) => h && !h.includes('?')));
            if (href) { await p.goto(B + href, { waitUntil: 'networkidle' }); await p.waitForTimeout(1500); await p.screenshot({ path: 'shots/admin-file.png', fullPage: true }); }
            for (const pg of ['steps', 'payments', 'whatsapp', 'documents']) { await p.goto(B + '/admin/' + pg, { waitUntil: 'networkidle' }); await p.waitForTimeout(1200); await p.screenshot({ path: `shots/admin-${pg}.png`, fullPage: true }); }
            await ctx.close();
          }
          await b.close();
          EOF
          mkdir -p shots && node shot.mjs
      - name: Publish screenshots to the ci-shots branch
        if: always()
        run: |
          cd shots
          git init -q -b ci-shots && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "dashboard screenshots" || exit 0
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: |
            shots
            server.log
